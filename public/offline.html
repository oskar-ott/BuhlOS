<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Phil</title>
    <meta name="theme-color" content="#0d1b34" />
    <!--
      Self-contained offline fallback for the Phil PWA (#135, Layer 1).
      Precached by /sw.js and served when a navigation fails with no signal,
      so a field worker sees an honest branded screen instead of the browser's
      dead-dinosaur error. Inline styles only — no external CSS/JS — so it
      renders fully even with zero network. P8: degrade honestly, never blank.
    -->
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #f4f5f7;
        color: #0d1b34;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 28rem;
        background: #ffffff;
        border: 1px solid #e3e6ec;
        border-left: 4px solid #c8902a; /* warning rail, matching Phil notices */
        border-radius: 14px;
        padding: 24px;
        text-align: left;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #8a6d1f;
        margin: 0 0 12px;
      }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c8902a; display: inline-block; }
      h1 { font-size: 20px; line-height: 1.25; margin: 0 0 8px; font-weight: 700; }
      p { font-size: 15px; line-height: 1.5; margin: 0 0 16px; color: #3b4458; }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #0d1b34;
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 18px;
        width: 100%;
        min-height: 48px;
        cursor: pointer;
      }
      button:active { opacity: 0.9; }
      .hint { font-size: 13px; color: #6b7280; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <main class="card" role="status" aria-live="polite">
      <p class="badge"><span class="dot" aria-hidden="true"></span>You're offline</p>
      <h1>No signal right now</h1>
      <p>
        This page needs a connection to load. Anything you've already opened
        stays on your phone — head back to it, or try again once you've got
        signal.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">Your hours, photos and task ticks only send when you're back online.</p>
    </main>
  </body>
</html>
