name: Preview Smoke

on:
  workflow_dispatch:
    inputs:
      preview_url:
        description: Vercel preview URL, for example https://branch-name.vercel.app
        required: true
        type: string

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.preview_url }}
      TEST_RUN_ID: ${{ github.run_id }}
      BUHLOS_TEST_ADMIN_EMAIL: ${{ secrets.BUHLOS_TEST_ADMIN_EMAIL }}
      BUHLOS_TEST_ADMIN_PASSWORD: ${{ secrets.BUHLOS_TEST_ADMIN_PASSWORD }}
      BUHLOS_TEST_FIELD_EMAIL: ${{ secrets.BUHLOS_TEST_FIELD_EMAIL }}
      BUHLOS_TEST_FIELD_PASSWORD: ${{ secrets.BUHLOS_TEST_FIELD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Validate inputs BEFORE installing anything (fail fast): refuse
      # production/unsupported targets, and REQUIRE both admin and field
      # credentials so Phil coverage is deterministic (never silently skipped).
      # Prints secret NAMES only — never values.
      - name: Validate Preview Smoke secrets (names only; admin + field required)
        run: |
          set -uo pipefail
          miss=0
          check() { if [ -n "${!1:-}" ]; then echo "  present  $1"; else echo "  MISSING  $1"; miss=$((miss+1)); fi; }
          echo "Preview Smoke inputs/secrets (values are NEVER printed):"
          check PLAYWRIGHT_BASE_URL
          check BUHLOS_TEST_ADMIN_EMAIL
          check BUHLOS_TEST_ADMIN_PASSWORD
          check BUHLOS_TEST_FIELD_EMAIL
          check BUHLOS_TEST_FIELD_PASSWORD
          if [ "$miss" -ne 0 ]; then
            echo "::error::Missing required Preview Smoke secrets/inputs (see MISSING above). Admin AND field credentials are required — Phil coverage must not silently skip."
            exit 1
          fi
      # Preview-only URL guard via a real URL parser (rejects production, empty,
      # malformed, bad ports, and look-alike hosts; logs sanitized host/protocol
      # only). Runs before npm ci. See scripts/qa/validate-preview-url.js.
      - name: Validate preview URL (no production targets)
        run: node scripts/qa/validate-preview-url.js
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run preview smoke
        # Strict mode: credentials are required above, so credential-gated specs
        # must RUN (not skip), and the assigned-active-job fixture must exist —
        # no silent Phil data-skips in Preview Smoke.
        env:
          BUHLOS_SMOKE_STRICT: "1"
        run: npm run test:smoke
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure traces, screenshots, and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
