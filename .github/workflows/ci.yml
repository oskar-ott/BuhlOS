name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-placeholder-session-secret-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and mocked-Blob API tests
        run: npm run test:unit
      - name: Smoke specs compile & are discoverable (Playwright --list; no browser, server, secrets, or data)
        run: npm run check:smoke-list
      - name: Build
        run: npm run build
      - name: Route + shell guards (modern surfaces + legacy quarantine)
        run: |
          npm run check:admin-shell
          npm run check:sw-cache-version
          npm run check:production-shell
          npm run check:route-ownership
          npm run check:shell-contract
          npm run check:legacy-quarantine
          npm run check:backup-manifest
          npm run check:role-literals
          npm run check:flag-expiry
          npm run check:read-flags-protected
          npm run check:model-ids
          npm run smoke:admin-routes
